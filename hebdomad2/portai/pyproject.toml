[project]
name = "portai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shamanth7", email = "brshamanth007@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.165.0",
    "groq>=1.7.0",
    "pydantic>=2.14.4",
    "pypdf>=7.1.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
portai = "portai:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.vercel]
entrypoint = "backend.main:app"

dependencies = [
    "fastapi",
    "groq",
    "pypdf",
    "python-dotenv",
    "pydantic",
]
