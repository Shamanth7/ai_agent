<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PortAI – Chat with my portfolio</title>
<style>
  :root {
    --bg: #0b0f1a;
    --panel: #121829;
    --border: #232b45;
    --text: #e8ecf8;
    --muted: #8b95b5;
    --accent: #6c8cff;
    --accent2: #a06cff;
    --user: linear-gradient(135deg, var(--accent), var(--accent2));
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 20% 0%, #172044 0%, var(--bg) 55%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 820px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 20px 16px;
  }
  header { text-align: center; padding: 8px 0 18px; }
  .avatar {
    width: 64px; height: 64px; border-radius: 50%;
    background: var(--user);
    display: grid; place-items: center;
    font-size: 28px; margin: 0 auto 10px;
    box-shadow: 0 0 30px rgba(108,140,255,.35);
  }
  header h1 { font-size: 1.4rem; }
  header p { color: var(--muted); font-size: .9rem; margin-top: 4px; }
  .status { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; font-size: .78rem; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #666; }
  .dot.on { background: #3ddc84; box-shadow: 0 0 8px #3ddc84; }
  .dot.off { background: #ff5c5c; }

  #chat {
    flex: 1;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }
  .msg {
    max-width: 82%;
    padding: 11px 15px;
    border-radius: 16px;
    line-height: 1.5;
    font-size: .95rem;
    white-space: pre-wrap;
    word-wrap: break-word;
    animation: pop .2s ease;
  }
  .msg.bot { background: #1b2340; border: 1px solid var(--border); align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.user { background: var(--user); align-self: flex-end; border-bottom-right-radius: 4px; color: #fff; }
  .msg.error { background: #3a1c24; border: 1px solid #6b2a38; color: #ffb3bf; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .typing { display: flex; gap: 5px; padding: 14px 16px; }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: bounce 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%,60%,100% { transform: translateY(0); opacity: .4; } 30% { transform: translateY(-6px); opacity: 1; } }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  .chip {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    padding: 7px 13px; border-radius: 999px; font-size: .82rem; cursor: pointer;
    transition: .15s;
  }
  .chip:hover { border-color: var(--accent); color: var(--text); }

  form { display: flex; gap: 10px; }
  input {
    flex: 1; background: var(--panel); border: 1px solid var(--border);
    color: var(--text); padding: 14px 16px; border-radius: 12px; font-size: .95rem; outline: none;
  }
  input:focus { border-color: var(--accent); }
  button.send {
    background: var(--user); color: #fff; border: none; border-radius: 12px;
    padding: 0 22px; font-size: .95rem; font-weight: 600; cursor: pointer;
  }
  button.send:disabled { opacity: .5; cursor: not-allowed; }
  footer { text-align: center; color: var(--muted); font-size: .72rem; margin-top: 10px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar">🤖</div>
    <h1>Chat with my AI Portfolio</h1>
    <p>Ask anything about my experience, skills, projects or education.</p>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">Connecting…</span></div>
  </header>

  <div id="chat"></div>

  <div class="chips" id="chips"></div>

  <form id="form">
    <input id="input" type="text" placeholder="Ask a question about me…" autocomplete="off" required />
    <button class="send" id="send" type="submit">Send</button>
  </form>
  <footer>Answers are generated from my resume only.</footer>
</div>

<script>
  // Change this if your backend runs elsewhere (or after deployment)
  const API_URL = "https://ai-agent-y198.vercel.app";;

  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const chipsBox = document.getElementById("chips");
  const dot = document.getElementById("dot");
  const statusText = document.getElementById("statusText");

  const suggestions = [
    "Tell me about yourself",
    "What are your key skills?",
    "Describe your work experience",
    "What projects have you built?",
    "What is your education?",
    "How many years of experience do you have?"
  ];

  suggestions.forEach(q => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    b.textContent = q;
    b.onclick = () => ask(q);
    chipsBox.appendChild(b);
  });

  function addMessage(text, type) {
    const div = document.createElement("div");
    div.className = "msg " + type;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function addTyping() {
    const div = document.createElement("div");
    div.className = "msg bot typing";
    div.innerHTML = "<span></span><span></span><span></span>";
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  async function ask(question) {
    if (!question.trim()) return;
    chipsBox.style.display = "none";
    addMessage(question, "user");
    input.value = "";
    sendBtn.disabled = true;
    input.disabled = true;
    const typing = addTyping();

    try {
      const res = await fetch(API_URL + "/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question })
      });
      if (!res.ok) throw new Error("Server returned " + res.status);
      const data = await res.json();
      typing.remove();
      addMessage(data.answer, "bot");
    } catch (err) {
      typing.remove();
      addMessage("Couldn't reach the server. Make sure the backend is running. (" + err.message + ")", "bot error");
    } finally {
      sendBtn.disabled = false;
      input.disabled = false;
      input.focus();
    }
  }

  form.addEventListener("submit", e => {
    e.preventDefault();
    ask(input.value);
  });

  async function checkBackend() {
    try {
      const r = await fetch(API_URL + "/");
      if (!r.ok) throw new Error();
      dot.className = "dot on";
      statusText.textContent = "Online";
    } catch {
      dot.className = "dot off";
      statusText.textContent = "Backend offline";
    }
  }

  addMessage("Hi! 👋 I'm an AI assistant representing this candidate. Ask me anything about their background.", "bot");
  checkBackend();
</script>
</body>
</html>
